<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلارم‌های طلا (XAUUSD)</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080C10;--panel:#0D1520;--panel2:#121D2A;--border:#1C2A38;--bordersoft:#162030;
--text:#DDE5EE;--muted:#7C8EA0;--muted2:#4E6070;--win:#1FCE6B;--loss:#F04060;--gold:#E8B340;--blue:#5B9BFF;
--fm:'Vazirmatn',sans-serif;--fmono:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(ellipse 1200px 500px at 15% -10%,rgba(232,179,64,.08),transparent),var(--bg);color:var(--text);font-family:var(--fm);line-height:1.7;}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px;}
.hero{margin-bottom:18px;}
.hero .eye{font-family:var(--fmono);font-size:11px;letter-spacing:.12em;color:var(--gold);margin-bottom:8px;}
.hero h1{font-size:22px;font-weight:900;margin-bottom:6px;}
.hero p{color:var(--muted);font-size:12.5px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.tabs button{background:none;border:none;color:var(--muted);font-family:var(--fm);font-size:13.5px;font-weight:700;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
.filters label{font-size:10.5px;color:var(--muted);display:block;margin-bottom:4px;}
.filters .fgroup{flex:1;min-width:120px;}
.filters input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 9px;font-family:var(--fm);font-size:12.5px;}
.filters button{align-self:flex-end;background:var(--gold);color:#080C10;border:none;border-radius:8px;padding:8px 16px;font-weight:800;font-size:12.5px;cursor:pointer;height:34px;}
.filters .clear{background:var(--panel2);color:var(--muted);border:1px solid var(--border);}
#list{display:flex;flex-direction:column;gap:10px;min-height:120px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.card .cond{font-weight:800;font-size:13.5px;}
.card .cond.above{color:var(--loss);}
.card .cond.below{color:var(--win);}
.card .price{font-family:var(--fmono);font-size:13px;color:var(--gold);}
.card .meta{font-size:11px;color:var(--muted);font-family:var(--fmono);display:flex;gap:10px;flex-wrap:wrap;}
.card .comment{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic;}
.empty{text-align:center;color:var(--muted2);padding:40px 0;font-size:13px;}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px;font-family:var(--fmono);font-size:12.5px;}
.pager button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;}
.pager button:disabled{opacity:.35;cursor:default;}
.count{color:var(--muted);font-size:11.5px;text-align:center;margin-top:6px;font-family:var(--fmono);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eye">XAUUSD · گلد دشبورد</div>
    <h1>🟡 آلارم‌های طلا</h1>
    <p>همه‌ی آلارم‌های فعال و فایرشده‌ی XAUUSD — برخلاف بقیه‌ی نمادها، اینجا همه چیز برای همه قابل دیدنه (بدون فیلتر شخصی/تیمی).</p>
  </div>

  <div class="tabs">
    <button id="tabActive" class="active" onclick="switchTab('active')">🟢 فعال</button>
    <button id="tabFired" onclick="switchTab('fired')">🔥 فایر شده</button>
  </div>

  <div class="filters">
    <div class="fgroup"><label>از تاریخ</label><input type="date" id="fFrom"></div>
    <div class="fgroup"><label>تا تاریخ</label><input type="date" id="fTo"></div>
    <div class="fgroup" style="flex:1.3"><label>فرستنده</label><input type="text" id="fSender" placeholder="مثلاً مسعود"></div>
    <button onclick="applyFilters()">فیلتر</button>
    <button class="clear" onclick="clearFilters()">پاک کردن</button>
  </div>

  <div id="list"></div>
  <div class="pager" id="pager" style="display:none">
    <button id="prevBtn" onclick="changePage(-1)">◀ قبلی</button>
    <span id="pageLabel"></span>
    <button id="nextBtn" onclick="changePage(1)">بعدی ▶</button>
  </div>
  <div class="count" id="countLabel"></div>
</div>

<script>
let currentStatus = 'active';
let currentPage = 1;

function switchTab(status) {
  currentStatus = status;
  currentPage = 1;
  document.getElementById('tabActive').classList.toggle('active', status==='active');
  document.getElementById('tabFired').classList.toggle('active', status==='fired');
  load();
}

function applyFilters() { currentPage = 1; load(); }
function clearFilters() {
  document.getElementById('fFrom').value = '';
  document.getElementById('fTo').value = '';
  document.getElementById('fSender').value = '';
  currentPage = 1;
  load();
}
function changePage(delta) { currentPage += delta; load(); }

function fmtCond(c) {
  return c === 'above' ? '📈 ناحیه سل (above)' : '📉 ناحیه بای (below)';
}

async function load() {
  const list = document.getElementById('list');
  list.innerHTML = '<div class="empty">در حال بارگذاری...</div>';
  const params = new URLSearchParams({
    status: currentStatus, page: currentPage, per_page: 10,
    from: document.getElementById('fFrom').value,
    to: document.getElementById('fTo').value,
    sender: document.getElementById('fSender').value,
  });
  try {
    const res = await fetch('/api/gold-alarms?' + params.toString());
    const data = await res.json();
    if (!data.ok) { list.innerHTML = '<div class="empty">خطا در دریافت داده</div>'; return; }
    if (data.items.length === 0) {
      list.innerHTML = '<div class="empty">چیزی پیدا نشد</div>';
    } else {
      list.innerHTML = data.items.map(renderCard).join('');
    }
    document.getElementById('pager').style.display = data.pages > 1 ? 'flex' : 'none';
    document.getElementById('pageLabel').textContent = `صفحه ${data.page} از ${data.pages}`;
    document.getElementById('prevBtn').disabled = data.page <= 1;
    document.getElementById('nextBtn').disabled = data.page >= data.pages;
    document.getElementById('countLabel').textContent = `${data.total} مورد`;
  } catch (e) {
    list.innerHTML = '<div class="empty">خطا در اتصال</div>';
  }
}

function renderCard(a) {
  const condCls = a.condition === 'above' ? 'above' : 'below';
  let html = `<div class="card">
    <div class="row1"><span class="cond ${condCls}">${fmtCond(a.condition)}</span><span class="price">${a.target_price ?? '—'}</span></div>
    <div class="meta"><span>👤 ${a.created_by}</span><span>📅 ثبت: ${a.created_at || '—'}</span>`;
  if (currentStatus === 'fired') {
    html += `<span>🔥 فایر: ${a.fired_at || '—'}</span><span>💰 قیمت فایر: ${a.fired_price ?? '—'}</span>`;
  }
  html += `</div>`;
  if (a.comment) html += `<div class="comment">💬 ${a.comment}</div>`;
  html += `</div>`;
  return html;
}

load();
</script>
</body>
</html>
